# Theater API: one OBS plugin per service (theater-api-twitch,
# theater-api-patreon, theater-api-kofi), installed or not, each on its own.
# Their alerts go out through the relay in Theater's shared alert shape,
# with or without Theater Reader.
[workspace]
resolver = "2"
members = ["common", "twitch", "patreon", "kofi"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
theater_shared = { path = "../Theater-Shared", features = ["relay"] }
theater_api_common = { path = "common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

[profile.release]
opt-level = 3
